<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生活数字直觉测验</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111a2f;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --good: #22c55e;
        --warn: #f59e0b;
        --bad: #ef4444;
        --border: #1f2a44;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, Segoe UI, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 10% 10%, #1e293b 0%, var(--bg) 38%, #020617 100%);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(860px, 100%);
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.75));
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      }
      h1, h2, h3, p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .pill {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.14);
        color: var(--accent);
        font-size: 12px;
      }
      .qbox {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 14px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .meta span {
        white-space: nowrap;
      }
      #questionText {
        font-size: 1.35rem;
        line-height: 1.45;
      }
      .hint {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .inputRow {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .guessInput {
        flex: 1;
        min-width: 180px;
        height: 44px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #020617;
        color: var(--text);
        padding: 0 12px;
        outline: none;
        font: inherit;
        font-size: 14px;
      }
      .guessInput:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
      }
      .sliderWrap {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }
      #guessSlider {
        width: 100%;
      }
      .guessVal {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #020617;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
      }
      .unit {
        color: var(--muted);
        font-size: 14px;
      }
      button {
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        background: linear-gradient(120deg, #0ea5e9, #6366f1);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .feedback {
        margin-top: 14px;
        font-size: 15px;
        min-height: 58px;
      }
      .scoreText {
        font-weight: 700;
        font-size: 20px;
      }
      .barRow {
        margin-top: 8px;
        width: 100%;
        height: 10px;
        border-radius: 99px;
        background: #0b1221;
        overflow: hidden;
      }
      .bar {
        height: 100%;
        border-radius: 99px;
      }
      .good { color: var(--good); }
      .warn { color: var(--warn); }
      .bad { color: var(--bad); }
      .summary {
        margin-top: 18px;
        display: grid;
        gap: 12px;
      }
      .category {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        background: #0b1221;
      }
      .category-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 14px;
      }
      .small {
        font-size: 13px;
        color: var(--muted);
      }
      .result-title {
        margin-top: 20px;
      }
      .result-sub {
        margin-top: 8px;
      }
      footer {
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .correct {
        font-size: 14px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row .pill {
        background: rgba(34, 197, 94, 0.14);
        color: var(--good);
      }
      .result-wrap {
        display: none;
      }
      .result-wrap.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <h1>生活数字直觉测验（MVP）</h1>
        <span class="pill">不算题，猜个量级</span>
      </div>
      <p class="muted">规则：只要猜接近数量级就行。支持凭感觉，不必精确；按量级打分。</p>

      <section id="quiz" class="qbox">
        <div class="meta">
          <span id="progress">第 1 / 10 题</span>
          <span id="category" class="pill">生物</span>
          <span id="liveScore" class="muted">当前得分：0</span>
        </div>

        <h2 id="questionText">题目加载中…</h2>
        <p id="hint" class="hint"></p>

        <div class="inputRow">
          <span id="unit" class="unit"></span>
          <input id="guessInput" class="guessInput" type="text" inputmode="decimal" placeholder="手动输入（支持 3e8 / 3*10^8）" />
        </div>

        <div class="sliderWrap">
          <div class="guessVal">
            <span id="guessLabel"></span>
            <span id="scaleHint" class="muted"></span>
          </div>
          <input id="guessSlider" type="range" />
        </div>

        <button id="actionBtn">提交</button>
        <p id="feedback" class="feedback"></p>
      </section>

      <section id="result" class="result-wrap">
        <h2 class="result-title">测验结果</h2>
        <p id="resultIntro" class="result-sub muted"></p>

        <div class="summary" id="categorySummary"></div>
        <p id="biasText" class="result-sub"></p>

        <p class="result-sub muted">你的每题明细（可用于回看）：</p>
        <div id="details" class="summary"></div>

        <button id="restartBtn">再玩一次</button>
      </section>

      <footer>
        提示：问题可因地域和时间略有差异，这版是 MVP 版本，目标是玩法通顺和可上线。
      </footer>
    </main>

        },
        {

          rangeHint: '按国家陆地+内陆水域口径'
        },
        {

          correct: 7800000000,
          unit: '人',

          rangeHint: '按近期统计口径在 80 亿左右'
        },
        {
          category: '地理',
          prompt: '长江长度大约多少？',
          correct: 6300,
          unit: 'km',
          scaleMin: 3000,
          scaleMax: 12000,
          targetMin: 5900,
          targetMax: 6600,
          rangeHint: '按主干道长度口径'
        },
        {
          category: '地理',
          prompt: '珠穆朗玛峰海拔大约多少？',
          correct: 8848,
          unit: 'm',
          scaleMin: 7000,
          scaleMax: 10000,
          targetMin: 8700,
          targetMax: 9000,
          rangeHint: '世界最高峰在 8.8km 量级'
        },
        {
          category: '地理',
          prompt: '北京到上海直线距离大约多少？',
          correct: 1060,
          unit: 'km',
          scaleMin: 300,
          scaleMax: 3000,
          targetMin: 990,
          targetMax: 1120,
          rangeHint: '看城市对城市距离，不一定是铁路里程'
        },
        {
          category: '地理',
          prompt: '世界上最大的沙漠（撒哈拉）面积大约多少？',
          correct: 9200000,
          unit: 'km²',
          scaleMin: 3000000,
          scaleMax: 20000000,
          targetMin: 8500000,
          targetMax: 10000000,
          rangeHint: '量级是“上千万平方公里”'
        }
      ];

      const state = {
        index: 0,
        items: shuffle([...questions]),
        answers: [],
        totalScore: 0,
        totalCount: 0,
        waitingNext: false,
        categoryStats: {}
      };

      const qText = document.getElementById('questionText');
      const qHint = document.getElementById('hint');
      const qUnit = document.getElementById('unit');
      const qCat = document.getElementById('category');
      const qProgress = document.getElementById('progress');
      const qLiveScore = document.getElementById('liveScore');
      const slider = document.getElementById('guessSlider');
      const guessInput = document.getElementById('guessInput');
      const guessLabel = document.getElementById('guessLabel');
      const scaleHint = document.getElementById('scaleHint');
      const feedback = document.getElementById('feedback');
      const actionBtn = document.getElementById('actionBtn');
      const resultWrap = document.getElementById('result');
      const quizBox = document.getElementById('quiz');
      const resultIntro = document.getElementById('resultIntro');
      const categorySummary = document.getElementById('categorySummary');
      const biasText = document.getElementById('biasText');
      const details = document.getElementById('details');
      const restartBtn = document.getElementById('restartBtn');

      try {
        renderQuestion();
      } catch (err) {
        console.error('[quiz] 初始化失败：', err);
        qText.textContent = '题目初始化失败，暂时无法显示题目';
        qHint.textContent = `错误信息：${err?.message || err}`;
        feedback.textContent = '请尝试强制刷新（Win/Linux: Ctrl+Shift+R，Mac: Cmd+Shift+R），若站点已更新仍有问题请告诉我控制台错误。';
        actionBtn.disabled = true;
      }

      actionBtn.addEventListener('click', () => {
        if (state.waitingNext) {
          goNext();
          return;
        }
        submitCurrent();
      });

      restartBtn.addEventListener('click', resetQuiz);

      function renderQuestion() {
        const current = state.items[state.index];
        if (!current) {
          throw new Error('题库为空或索引越界，无法加载题目');
        }
        qProgress.textContent = `第 ${state.index + 1} / ${state.items.length} 题`;
        qCat.textContent = current.category;
        qText.textContent = current.prompt;
        qHint.textContent = current.rangeHint || '';
        qUnit.textContent = `单位：${current.unit}`;
        if (!Number.isFinite(current.scaleMin) || !Number.isFinite(current.scaleMax) || current.scaleMin <= 0 || current.scaleMax <= 0) {
          current.scaleMin = current.correct / 3;
          current.scaleMax = current.correct * 3;
        }
        const min = Math.log10(current.scaleMin);
        const max = Math.log10(current.scaleMax);
        slider.min = min.toString();
        slider.max = max.toString();
        slider.step = (((max - min) / 600) || 0.01).toFixed(4);
        const middle = (min + max) / 2;
        slider.value = middle.toString();
        onSliderChange();
        feedback.innerHTML = '';
        actionBtn.textContent = '提交';
        state.waitingNext = false;
      }

      let isSyncingInputs = false;

      slider.addEventListener('input', onSliderChange);
      guessInput.addEventListener('input', onManualInputChange);

      function onManualInputChange() {
        if (isSyncingInputs) return;
        const current = state.items[state.index];
        const value = parseInputNumber(guessInput.value);
        if (!Number.isFinite(value) || value <= 0) return;

        const scaleMin = current.scaleMin || current.correct / 3;
        const scaleMax = current.scaleMax || current.correct * 3;
        const clamped = Math.min(Math.max(value, scaleMin), scaleMax);
        isSyncingInputs = true;
        slider.value = Math.log10(clamped).toString();
        onSliderChange();
        isSyncingInputs = false;
      }

      function onSliderChange() {
        const guess = exp10(Number(slider.value));
        const current = state.items[state.index];
        const scaleMin = current.scaleMin || current.correct / 3;
        const scaleMax = current.scaleMax || current.correct * 3;
        const minExp = Math.log10(scaleMin);
        const maxExp = Math.log10(scaleMax);
        const ratio = (Number(slider.value) - minExp) / (maxExp - minExp);
        scaleHint.textContent = `范围：${formatNumber(scaleMin)} ~ ${formatNumber(scaleMax)}，位置：${Math.round(ratio * 100)}%`;
        guessLabel.textContent = `你选择：${formatNumber(guess)} ${current.unit}`;
        if (!isSyncingInputs) {
          isSyncingInputs = true;
          guessInput.value = formatManualInput(guess);
          isSyncingInputs = false;
        }
      }

      function submitCurrent() {
        const current = state.items[state.index];
        const guess = exp10(Number(slider.value));

        const score = scoreEstimate(guess, current);
        const direction = guess > current.correct ? '高估' : guess < current.correct ? '低估' : '正好';
        const closeness = score >= 90 ? '非常准' : score >= 75 ? '接近' : score >= 55 ? '有点偏' : '偏差明显';

        const colorClass = score >= 80 ? 'good' : score >= 60 ? 'warn' : 'bad';

        state.totalScore += score;
        state.totalCount += 1;

        if (!state.categoryStats[current.category]) {
          state.categoryStats[current.category] = { sum: 0, count: 0, over: 0, under: 0 };
        }
        state.categoryStats[current.category].sum += score;
        state.categoryStats[current.category].count += 1;
        if (guess > current.correct) {
          state.categoryStats[current.category].over += 1;
        } else if (guess < current.correct) {
          state.categoryStats[current.category].under += 1;
        }

        state.answers.push({
          q: current,
          guess,
          score,
          direction,
          closeness
        });

        const factor = current.correct > 0 ? guess / current.correct : 0;
        const expected = `参考值：${formatNumber(current.correct)} ${current.unit}`;

        feedback.innerHTML = `
          <span class="scoreText ${colorClass}">${direction}，本题得分 ${score} 分，${closeness}</span><br />
          <span class="correct muted">你选了 ${formatNumber(guess)} ${current.unit}，${expected}，约数倍差：${factor.toFixed(2)}x</span>
        `;

        qLiveScore.textContent = `当前得分：${Math.round((state.totalScore / state.totalCount) * 100) / 100}`;

        actionBtn.textContent = state.index < state.items.length - 1 ? '下一题' : '看结果';
        state.waitingNext = true;
      }

      function goNext() {
        state.index += 1;
        if (state.index >= state.items.length) {
          showResult();
          return;
        }
        renderQuestion();
      }

      function showResult() {
        quizBox.style.display = 'none';
        resultWrap.classList.add('show');

        const avg = Math.round((state.totalScore / state.totalCount) * 10) / 10;
        const over = state.answers.filter((item) => item.direction === '高估').length;
        const under = state.answers.filter((item) => item.direction === '低估').length;
        const same = state.answers.length - over - under;

        resultIntro.textContent = `总分 ${avg.toFixed(1)} / 100。你一共答对量级感受最好的 ${state.answers.filter(a => a.score >= 80).length} 题，明显偏差 ${state.answers.filter(a => a.score < 50).length} 题。`;
        biasText.textContent = `整体判断：你更倾向于${over > under ? '高估' : over < under ? '低估' : '相对均衡'}。`;

        categorySummary.innerHTML = '';
        const entries = Object.entries(state.categoryStats).sort(
          (a, b) => b[1].sum / b[1].count - a[1].sum / a[1].count
        );
        for (const [cat, v] of entries) {
          const avgCat = Math.round((v.sum / v.count) * 10) / 10;
          const barColor = avgCat >= 80 ? '#22c55e' : avgCat >= 60 ? '#f59e0b' : '#ef4444';
          categorySummary.insertAdjacentHTML('beforeend', `
            <div class="category">
              <div class="category-top">
                <strong>${cat}</strong>
                <span class="muted">${avgCat.toFixed(1)} 分</span>
              </div>
              <div class="barRow"><div class="bar" style="width:${avgCat}%;background:${barColor}"></div></div>
              <p class="small">高估 ${v.over} 题 · 低估 ${v.under} 题 · 共 ${v.count} 题</p>
            </div>
          `);
        }

        details.innerHTML = state.answers
          .map((item, idx) => {
            const colorClass = item.score >= 80 ? 'good' : item.score >= 60 ? 'warn' : 'bad';
            return `
              <div class="category">
                <div class="category-top">
                  <span>Q${idx + 1}（${item.q.category}）</span>
                  <span class="${colorClass}">${item.score} 分</span>
                </div>
                <p class="small muted">${item.q.prompt}</p>
                <p class="small">你的答案：${formatNumber(item.guess)}，参考：${formatNumber(item.q.correct)} · ${item.direction} ${item.closeness}</p>
              </div>
            `;
          }).join('');
      }

      function resetQuiz() {
        state.index = 0;
        state.items = shuffle([...questions]);
        state.answers = [];
        state.totalScore = 0;
        state.totalCount = 0;
        state.waitingNext = false;
        state.categoryStats = {};

        quizBox.style.display = 'block';
        resultWrap.classList.remove('show');
        qLiveScore.textContent = '当前得分：0';
        renderQuestion();
      }

      function scoreEstimate(guess, q) {
        if (!Number.isFinite(guess) || !Number.isFinite(q.correct) || guess <= 0 || q.correct <= 0) return 0;

        const targetMin = clampPositive(q.targetMin, q.correct * 0.45, q.correct * 2.5);
        const targetMax = clampPositive(q.targetMax, q.correct * 0.55, q.correct * 3.5);
        const tMinLog = Math.log10(Math.min(targetMin, targetMax));
        const tMaxLog = Math.log10(Math.max(targetMin, targetMax));
        const guessLog = Math.log10(guess);
        const targetCenterLog = (tMinLog + tMaxLog) / 2;
        const targetSpan = Math.max(tMaxLog - tMinLog, 1e-9);
        const correctLog = Math.log10(q.correct);
        const diff = Math.abs(guessLog - correctLog);
        const centerPenalty = Math.abs(guessLog - targetCenterLog) / targetSpan * 10;
        const slope = q.scoreSlope || 360;
        if (diff < 1e-12) return 100;
        const raw = 100 - diff * slope - centerPenalty;
        return Math.max(0, Math.min(100, Math.round(raw)));
      }

      function clampLog(x, min, max) {
        if (!Number.isFinite(x) || !Number.isFinite(min) || !Number.isFinite(max)) return min;
        const log = Math.log10(x);
        return Math.min(max, Math.max(min, log));
      }

      function clampPositive(v, min, max) {
        if (!Number.isFinite(v) || v <= 0) return NaN;
        return Math.min(Math.max(v, min), max);
      }

      function exp10(value) {
        return Number(Math.pow(10, value).toPrecision(15));
      }

      function formatNumber(x) {
        if (!Number.isFinite(x)) return String(x);
        if (Math.abs(x) >= 1e6 || (Math.abs(x) > 0 && Math.abs(x) < 1e-3)) {
          return Number.parseFloat(x.toPrecision(4)).toExponential();
        }
        return removeTrailingZero(Number(x.toFixed(4)));
      }

      function parseInputNumber(raw) {
        if (!raw) return NaN;
        const normalized = String(raw)
          .trim()
          .replace(/,/g, '')
          .replace(/\s+/g, '')
          .replace(/×/g, '*')
          .replace(/x/g, '*');
        if (!normalized) return NaN;

        const match = normalized.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))(?:\*(?:10\^([+-]?\d+)|10e([+-]?\d+)|e([+-]?\d+)))$/i);
        if (match) {
          const base = match[1];
          const exp = match[2] || match[3] || match[4];
          return Number(`${base}e${exp}`);
        }

        return Number(normalized);
      }

      function formatManualInput(x) {
        if (!Number.isFinite(x)) return '';
        if (x >= 1e6 || (x > 0 && x < 1e-3)) {
          return Number.parseFloat(x.toPrecision(8)).toExponential(4);
        }
        return removeTrailingZero(Number(x.toPrecision(12)));
      }

      function removeTrailingZero(s) {
        return String(s).replace(/(?:\.\d*?)0+$/, '').replace(/\.$/, '');
      }

      function shuffle(array) {
        const a = [...array];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
